<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/pages.css">

<body>
<a class="skip" href="#main">Skip to content</a>
<header class="nav">
  <a class="brand" href="../" aria-label="OpenSmash-Ultimate, home">
    <img class="brand-mark" src="../assets/emblem-white.svg" alt="" aria-hidden="true">
    <span class="brand-word">OPENSMASH<span>-ULTIMATE</span></span>
  </a>
  <button class="nav-toggle" aria-expanded="false" aria-controls="nav-links"><span></span><span></span><span class="sr">Menu</span></button>

<main id="main" class="page">
  <div class="wrap">
    <h1>Leader<span>board</span></h1>
    <p class="lede">Online players ranked by GSP. Pick a fighter to see who is best with it.</p>
    <p class="muted" id="updated"></p>
    <div id="status" class="notice" role="status" aria-live="polite">Loading&hellip;</div>

    <div id="content" class="hidden">
      <div class="picker">
        <label for="fighter">Ranking</label>
        <select id="fighter"><option value="">Overall</option></select>
      </div>
      <div class="table-wrap">
        <table class="board">
          <thead><tr id="head"></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </div>
</main>
