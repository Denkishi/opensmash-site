name: Update leaderboard and status

# One long-running job that snapshots the lobby (plain HTTP, so the HTTPS site cannot read it) every ~2.5 minutes
# and writes status.json / leaderboard.json to the `data` branch (not served by Pages: no Pages builds).
# The site reads https://raw.githubusercontent.com/Denkishi/opensmash-site/data/<file>.
#
# Reliability: GitHub's cron is best effort and often skipped, so the job loops for 5 h 50 m and then starts its own
# successor with `gh workflow run`. GITHUB_TOKEN is allowed to do that: workflow_dispatch and repository_dispatch are
# the two events that, unlike all others, DO create runs when sent with GITHUB_TOKEN (it needs actions: write).
# The concurrency group keeps a single loop; the successor waits as "pending" until this one ends.
# The hourly schedule is only a backup in case the chain ever breaks (failure, cancel).

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: leaderboard
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self-test (offline)
        run: python .github/scripts/leaderboard.py --selftest
      - name: Sign-in self-test (offline)
        run: node .github/opensmash-auth.test.cjs
      - name: Snapshot loop (5 h 50 m)
        env:
          DATA_DIR: ${{ github.workspace }}/data
          HEARTBEAT_S: "600"
          INTERVAL_S: "150"
          LOOP_S: "21000"
        run: bash .github/scripts/loop.sh
      - name: Start the next loop
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run leaderboard.yml --ref "${{ github.event.repository.default_branch }}" --repo "${{ github.repository }}"
