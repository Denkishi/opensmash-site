name: Update leaderboard and status

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leaderboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self-test (offline)
        run: python .github/scripts/leaderboard.py --selftest
      - name: Build leaderboard.json and status.json from the lobby server
        run: python .github/scripts/leaderboard.py
      - name: Commit when changed
        run: |
          # "updated" changes on every run: only commit when the data itself changed.
          if git diff --quiet -- leaderboard.json status.json && [ -z "$(git ls-files --others --exclude-standard status.json)" ]; then
            echo "leaderboard.json and status.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leaderboard.json status.json
          git commit -m "Update leaderboard and status"
          git pull --rebase -q
          git push
